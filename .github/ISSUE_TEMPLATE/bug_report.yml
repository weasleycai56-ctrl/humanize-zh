name: Bug report
description: Report reproducible incorrect behavior in the Skill, CLI, tests, or docs.
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste private, confidential, copyrighted, or identifying text. Replace it with a minimal synthetic example.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0 or commit SHA
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Skill behavior
        - Deterministic audit CLI
        - Rule documentation
        - Test fixture
        - Installation or documentation
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Minimal synthetic example
      description: Include selected mode and profile. Confirm the text is safe to publish.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: consent
    attributes:
      label: Publication check
      options:
        - label: The example is synthetic, mine to publish, or compatibly licensed and attributed.
          required: true
        - label: I removed personal data, credentials, and confidential information.
          required: true
